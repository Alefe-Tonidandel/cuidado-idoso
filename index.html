<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>❤️ Cuidado com Amor</title>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#3D8B7A"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Cuidado"/>
<style>
@import url('https://fonts.googleapis.com/css2?family=Lora:wght@400;600&family=Inter:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --teal:#3D8B7A;--teal-d:#2A6458;--teal-l:#E8F4F1;
  --cream:#FDF8F0;--warm:#F5EDE0;--border:#E8DDD0;
  --text:#2C2416;--muted:#7A6E62;--white:#fff;
  --amber:#C9922A;--amber-l:#FBF4E8;
  --purple:#7B6BAE;--purple-l:#F0EEF8;
  --coral:#E07055;--coral-l:#FBF0ED;
  --green:#3D8B5A;--green-l:#E8F4EC;
  --red:#C94040;--red-l:#FBE8E8;
  --pink:#B5548A;--pink-l:#F8EDF4;
  --serif:'Lora',Georgia,serif;--sans:'Inter',system-ui,sans-serif;
}
body{background:var(--cream);font-family:var(--sans);color:var(--text);min-height:100vh}
button{font-family:var(--sans);cursor:pointer;border:none;background:none}
input,textarea,select{font-family:var(--sans);font-size:14px;color:var(--text);background:var(--white);border:1.5px solid var(--border);border-radius:10px;padding:11px 14px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--teal)}
textarea{resize:vertical}
.screen{display:none;flex-direction:column;min-height:100vh;max-width:520px;margin:0 auto}
.screen.on{display:flex}
.auth-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px}
.auth-form{width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px;margin-bottom:0}
.btn{border-radius:12px;padding:13px;font-size:15px;font-weight:600;width:100%;cursor:pointer;border:none;font-family:var(--sans)}
.btn-p{background:var(--teal);color:white}.btn-p:hover{background:var(--teal-d)}.btn-p:disabled{opacity:.5}
.btn-g{background:transparent;color:var(--teal);border:1.5px solid var(--teal)}
.btn-r{background:var(--red);color:white}
.fl{display:flex;flex-direction:column;gap:4px}
.fl label{font-size:12px;font-weight:600;color:var(--muted)}
.header{background:var(--teal);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;color:white;flex-shrink:0;position:sticky;top:0;z-index:100}
.sos{background:var(--red);border-radius:20px;padding:8px 15px;color:white;font-size:13px;font-weight:700;border:none;cursor:pointer}
.tabs{display:flex;overflow-x:auto;background:var(--white);border-bottom:1px solid var(--border);flex-shrink:0;position:sticky;top:56px;z-index:99;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 13px;font-size:11px;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap;background:none;border-top:none;border-left:none;border-right:none;cursor:pointer}
.tab.on{color:var(--teal);border-bottom-color:var(--teal);background:var(--teal-l)}
.ti{font-size:18px}
.content{flex:1;overflow-y:auto;padding:16px 16px 80px}
.card{background:var(--white);border-radius:16px;border:1px solid var(--border);padding:16px 18px;margin-bottom:14px}
.ct{font-weight:700;font-size:15px;margin-bottom:12px}
.bdg{display:inline-block;border-radius:8px;padding:3px 10px;font-size:11px;font-weight:600}
.bl{background:var(--green-l);color:var(--green)}
.bm{background:var(--amber-l);color:var(--amber)}
.bg{background:var(--coral-l);color:var(--coral)}
.bc{background:var(--red-l);color:var(--red)}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#2C2416;color:white;padding:11px 22px;border-radius:24px;font-size:14px;z-index:9999;display:none;white-space:nowrap}
#obar{display:none;position:fixed;top:0;left:0;right:0;background:var(--red);color:white;text-align:center;padding:7px;font-size:12px;font-weight:600;z-index:9998}
#pwab{display:none;position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;z-index:9997;background:var(--teal-d);color:white;padding:14px 16px;align-items:center;gap:12px;border-radius:18px 18px 0 0;box-shadow:0 -4px 24px rgba(0,0,0,.2)}
.spin{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--teal);border-radius:50%;animation:sp .7s linear infinite;margin:36px auto}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fi{animation:fi .25s ease}
.emp{text-align:center;padding:36px 20px;color:var(--muted)}
.emp-i{font-size:38px;margin-bottom:10px}
.sb{background:var(--warm);border-radius:10px;padding:11px;text-align:center;flex:1}
.sn{font-size:20px;font-weight:700;color:var(--teal)}
.sl{font-size:10px;color:var(--muted);margin-top:2px}
.pb{background:var(--warm);border-radius:8px;height:8px;overflow:hidden;margin-top:6px}
.pf{height:100%;background:var(--teal);border-radius:8px;transition:width .4s}
.rr{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--border)}
.rr:last-child{border-bottom:none}
.rc{width:26px;height:26px;border-radius:50%;border:2px solid var(--teal);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-size:13px}
.rc.on{background:var(--teal);border-color:var(--teal);color:white}
.wbb{border-radius:12px;padding:12px 6px;border:1.5px solid var(--border);background:var(--white);display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--muted);flex:1;cursor:pointer}
.wbb.on{border-color:var(--teal);background:var(--teal-l);color:var(--teal);font-weight:600}
.bub{max-width:82%;border-radius:18px;padding:10px 14px;font-size:14px;line-height:1.6;word-break:break-word}
.bm2{background:var(--teal);color:white;border-radius:18px 18px 4px 18px;margin-left:auto}
.bo{background:var(--warm);color:var(--text);border-radius:18px 18px 18px 4px}
.bw{display:flex;flex-direction:column;margin-bottom:10px}
.bw.me{align-items:flex-end}
.bmt{font-size:10px;color:var(--muted);margin-top:3px;padding:0 4px}
.mb{background:var(--warm);border-radius:8px;height:8px;margin:8px 0;overflow:hidden}
.mf{height:100%;border-radius:8px;transition:width .4s}
.mc{width:34px;height:34px;border-radius:50%;border:2.5px solid var(--teal);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-size:16px;background:white;transition:all .15s}
.mc.on{background:var(--teal);border-color:var(--teal)}
.mr{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--border)}
.mr:last-child{border-bottom:none}
.av{width:36px;height:36px;border-radius:50%;background:var(--teal-l);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;display:flex;align-items:flex-end;justify-content:center}
.mod{background:var(--white);border-radius:20px 20px 0 0;padding:22px 20px;width:100%;max-width:520px;max-height:88vh;overflow-y:auto}
.mtit{font-family:var(--serif);font-size:18px;font-weight:600;margin-bottom:14px}
</style>
</head>
<body>
<div id="obar">📡 Sem internet — modo offline</div>
<div id="pwab">
  <span style="font-size:26px;flex-shrink:0">❤️</span>
  <div style="flex:1;font-size:13px;line-height:1.4"><strong style="display:block;font-size:14px;margin-bottom:2px">Instalar o app</strong>Use na tela inicial, sem internet!</div>
  <button onclick="installPWA()" style="background:white;color:var(--teal-d);border:none;border-radius:10px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--sans);flex-shrink:0">Instalar</button>
  <button onclick="el('pwab').style.display='none'" style="background:none;border:none;color:rgba(255,255,255,.7);font-size:20px;cursor:pointer;flex-shrink:0">✕</button>
</div>
<div id="toast"></div>

<!-- AUTH -->
<div id="s-auth" class="screen on">
  <div class="auth-wrap">
    <div style="font-size:52px;margin-bottom:10px">❤️</div>
    <h1 style="font-family:var(--serif);font-size:24px;color:var(--teal-d);margin-bottom:6px;font-weight:600">Cuidado com Amor</h1>
    <p style="font-size:13px;color:var(--muted);margin-bottom:28px;text-align:center">Acompanhamento de saúde<br>para toda a família</p>
    <div class="auth-form" id="af"></div>
  </div>
</div>

<!-- SELECT -->
<div id="s-sel" class="screen">
  <div style="padding:24px 18px 0">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <div>
        <h2 style="font-family:var(--serif);font-size:19px;color:var(--teal-d)">❤️ Cuidado com Amor</h2>
        <div style="font-size:12px;color:var(--muted);margin-top:2px" id="sel-u"></div>
      </div>
      <button onclick="doLogout()" style="font-size:12px;color:var(--muted);padding:6px 10px;border:1px solid var(--border);border-radius:8px">Sair</button>
    </div>
    <div id="tip-b" style="background:var(--purple-l);border:1px solid #C5BDE0;border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:13px;color:var(--text);line-height:1.6">
      <strong style="color:var(--purple)">💡</strong> <span id="tip-t"></span>
    </div>
    <p style="font-size:13px;color:var(--muted);margin-bottom:10px">Seus pacientes</p>
    <div id="pat-list"><div class="spin"></div></div>
    <button onclick="showAddPat()" style="width:100%;padding:12px;border:1.5px dashed var(--teal);border-radius:12px;color:var(--teal);font-size:14px;font-weight:600;margin-top:4px;background:transparent">+ Adicionar paciente</button>
    <button onclick="showJoinPat()" style="width:100%;padding:10px;color:var(--muted);font-size:13px;margin-top:6px;background:transparent;border:none">Tenho um código de convite →</button>
  </div>
</div>

<!-- APP -->
<div id="s-app" class="screen">
  <div class="header">
    <div style="display:flex;align-items:center;gap:10px">
      <button onclick="goSel()" style="color:white;font-size:22px;padding:0 6px 0 0;background:none;border:none;cursor:pointer">←</button>
      <div>
        <div style="font-weight:700;font-size:15px" id="h-n">—</div>
        <div style="font-size:11px;opacity:.8" id="h-s">—</div>
      </div>
    </div>
    <button class="sos" onclick="trigSOS()">🚨 SOS</button>
  </div>
  <div id="sos-b" style="display:none;background:var(--red-l);border-bottom:2px solid var(--red);padding:13px 16px;flex-shrink:0">
    <div style="font-weight:700;color:var(--red);font-size:14px;margin-bottom:5px">🚨 Emergência!</div>
    <div style="font-size:13px;line-height:1.8"><strong>SAMU: 192</strong> · <strong>Bombeiros: 193</strong> · <strong>CVV: 188</strong><br><span style="color:var(--muted);font-size:11px">Todos os cuidadores foram notificados.</span></div>
  </div>
  <div class="tabs">
    <button class="tab on" onclick="gT('home')"   id="t-home">  <span class="ti">🏠</span>Início</button>
    <button class="tab"    onclick="gT('meds')"   id="t-meds">  <span class="ti">💊</span>Remédios</button>
    <button class="tab"    onclick="gT('agenda')" id="t-agenda"><span class="ti">📅</span>Rotina</button>
    <button class="tab"    onclick="gT('quick')"  id="t-quick"> <span class="ti">⚡</span>Ações</button>
    <button class="tab"    onclick="gT('diary')"  id="t-diary"> <span class="ti">📝</span>Diário</button>
    <button class="tab"    onclick="gT('wb')"     id="t-wb">    <span class="ti">😊</span>Bem-estar</button>
    <button class="tab"    onclick="gT('chat')"   id="t-chat">  <span class="ti">💬</span>Chat</button>
    <button class="tab"    onclick="gT('mem')"    id="t-mem">   <span class="ti">📸</span>Memórias</button>
    <button class="tab"    onclick="gT('music')"  id="t-music"> <span class="ti">🎵</span>Músicas</button>
    <button class="tab"    onclick="gT('rep')"    id="t-rep">   <span class="ti">📊</span>Relatório</button>
    <button class="tab"    onclick="gT('cfg')"    id="t-cfg">   <span class="ti">⚙️</span>Config</button>
  </div>
  <div class="content fi" id="app-c"></div>
</div>

<!-- MODAL -->
<div id="mbg" class="mbg" style="display:none" onclick="if(event.target===this)closeMod()">
  <div class="mod" id="mb"></div>
</div>

<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged,updateProfile,sendPasswordResetEmail}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import{getFirestore,collection,doc,setDoc,getDoc,getDocs,addDoc,updateDoc,deleteDoc,onSnapshot,query,where,orderBy,serverTimestamp,arrayUnion,arrayRemove}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const FB={apiKey:"AIzaSyCfH7j_xBn5JSWOW7HUCBPNlRRK3hhjYf4",authDomain:"cuidado-idoso.firebaseapp.com",projectId:"cuidado-idoso",storageBucket:"cuidado-idoso.firebasestorage.app",messagingSenderId:"762117184152",appId:"1:762117184152:web:180a4b55315bff8c690eed"};
const app=initializeApp(FB);
const auth=getAuth(app);
const db=getFirestore(app);

// ── HELPERS ──
const el=id=>document.getElementById(id);
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const today=()=>new Date().toISOString().split('T')[0];
const nowT=()=>new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const fmtD=d=>{if(!d)return'';const p=d.split('-');return`${p[2]}/${p[1]}/${p[0]}`};
const fmtTS=ts=>{if(!ts)return'';const d=ts.toDate?ts.toDate():new Date(ts);return d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})};

let _tt;
window.toast=msg=>{const t=el('toast');t.textContent=msg;t.style.display='block';clearTimeout(_tt);_tt=setTimeout(()=>t.style.display='none',3200)};
const show=id=>{document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));el(id).classList.add('on')};
window.openMod=html=>{el('mb').innerHTML=html;el('mbg').style.display='flex'};
window.closeMod=()=>el('mbg').style.display='none';

// ── STATE ──
let CU=null,CP=null,AT='home',UNS=[],QA=null,SM=null,SP=null;

// ── TIPS ──
const TIPS=["Manter ambiente calmo e bem iluminado reduz confusão e alucinações.","Evite mudanças bruscas na rotina — previsibilidade traz segurança.","⚠️ Antipsicóticos típicos (haloperidol) são PERIGOSOS na Síndrome de Lewy.","Flutuações cognitivas ao longo do dia são características normais.","Exercícios suaves 10-15min/dia melhoram equilíbrio e sono.","Ofereça água a cada 2 horas — idosos raramente sentem sede.","Cuidar de si mesmo é essencial. Cuidador esgotado não cuida bem.","Não corrija alucinações. Diga: 'Estou aqui com você. Você está seguro.'"];
let TI=0;
function rotTip(){const t=el('tip-t');if(t)t.textContent=TIPS[TI++%TIPS.length]}

// ══ AUTH ══
window.renderLogin=function(){
  el('af').innerHTML=`
  <div class="fl"><label>E-mail</label><input id="ae" type="email" placeholder="seu@email.com" autocomplete="email"/></div>
  <div class="fl"><label>Senha</label><input id="ap" type="password" placeholder="••••••••" autocomplete="current-password"/></div>
  <button class="btn btn-p" id="ab" onclick="doLogin()">Entrar</button>
  <button class="btn btn-g" onclick="if(window._app)window._app.renderReg()">Criar conta</button>
  <div style="text-align:center;margin-top:4px"><span style="font-size:13px;color:var(--teal);cursor:pointer" onclick="doForgot()">Esqueci minha senha</span></div>`;
}
window.renderReg=function(){
  el('af').innerHTML=`
  <div class="fl"><label>Seu nome</label><input id="an" type="text" placeholder="Maria Silva" autocomplete="name"/></div>
  <div class="fl"><label>E-mail</label><input id="ae" type="email" placeholder="seu@email.com" autocomplete="email"/></div>
  <div class="fl"><label>Senha (mín. 6 caracteres)</label><input id="ap" type="password" placeholder="••••••••" autocomplete="new-password"/></div>
  <button class="btn btn-p" id="ab" onclick="doReg()">Criar conta</button>
  <button class="btn btn-g" onclick="if(window._app)window._app.renderLogin()">Já tenho conta</button>`;
}
window._renderReg   = window.renderReg;
window._renderLogin = window.renderLogin;
window._doForgot    = window.doForgot;
window.doLogin=async()=>{
  const e=el('ae')?.value?.trim(),p=el('ap')?.value;
  if(!e||!p){toast('Preencha e-mail e senha.');return}
  const b=el('ab');b.disabled=true;b.textContent='Entrando...';
  try{await signInWithEmailAndPassword(auth,e,p)}
  catch(err){toast(err.code==='auth/invalid-credential'?'E-mail ou senha incorretos.':'Erro: '+err.message);b.disabled=false;b.textContent='Entrar'}
};
window.doReg=async()=>{
  const n=el('an')?.value?.trim(),e=el('ae')?.value?.trim(),p=el('ap')?.value;
  if(!n||!e||!p){toast('Preencha todos os campos.');return}
  if(p.length<6){toast('Senha: mínimo 6 caracteres.');return}
  const b=el('ab');b.disabled=true;b.textContent='Criando...';
  try{
    const c=await createUserWithEmailAndPassword(auth,e,p);
    await updateProfile(c.user,{displayName:n});
    await setDoc(doc(db,'users',c.user.uid),{name:n,email:e,createdAt:serverTimestamp()});
  }catch(err){toast(err.code==='auth/email-already-in-use'?'E-mail já cadastrado.':'Erro: '+err.message);b.disabled=false;b.textContent='Criar conta'}
};
window.doForgot=async()=>{
  const e=el('ae')?.value?.trim();
  if(!e){toast('Digite seu e-mail primeiro.');return}
  try{await sendPasswordResetEmail(auth,e);toast('✅ E-mail de recuperação enviado!')}
  catch(err){toast('Erro: '+err.message)}
};
window.doLogout=async()=>{UNS.forEach(u=>u());UNS=[];await signOut(auth)};

onAuthStateChanged(auth,u=>{
  CU=u;
  if(u){show('s-sel');loadSel()}
  else{show('s-auth');renderLogin()}
});

// ══ SELECT ══
function loadSel(){
  el('sel-u').textContent='Olá, '+(CU.displayName||CU.email);
  rotTip();clearInterval(window._tipInt);window._tipInt=setInterval(rotTip,9000);
  loadPats();
}
async function loadPats(){
  const L=el('pat-list');L.innerHTML='<div class="spin"></div>';
  const q=query(collection(db,'patients'),where('members','array-contains',CU.uid));
  const sn=await getDocs(q);
  if(sn.empty){L.innerHTML='<div class="emp"><div class="emp-i">👴</div><p>Nenhum paciente ainda.<br>Adicione o primeiro ou use um código de convite.</p></div>';return}
  L.innerHTML='';
  sn.forEach(d=>{
    const p=d.data();
    const low=(p.medications||[]).some(m=>Math.floor(m.stock/(m.daily||1))<7);
    L.innerHTML+=`<div style="background:var(--white);border-radius:16px;border:1px solid ${low?'var(--red)':'var(--border)'};padding:16px;margin-bottom:12px;cursor:pointer" onclick="openPat('${d.id}')">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">
        <div style="width:48px;height:48px;border-radius:50%;background:var(--teal-l);display:flex;align-items:center;justify-content:center;font-size:24px">${p.avatar||'👴'}</div>
        <div style="flex:1"><div style="font-size:16px;font-weight:700">${esc(p.name)}, ${p.age} anos</div><div style="font-size:12px;color:var(--muted);margin-top:1px">${esc(p.condition||'')}</div></div>
        ${low?'<span style="background:var(--red-l);color:var(--red);padding:4px 9px;border-radius:8px;font-size:11px;font-weight:700">⚠️ Estoque</span>':''}
      </div>
      <div style="display:flex;gap:8px">
        <div style="flex:1;background:var(--amber-l);border-radius:8px;padding:8px;text-align:center;font-size:12px;color:var(--amber)">💊 ${(p.medications||[]).length} remédios</div>
        <div style="flex:1;background:var(--purple-l);border-radius:8px;padding:8px;text-align:center;font-size:12px;color:var(--purple)">👥 ${(p.members||[]).length} cuidadores</div>
      </div>
    </div>`;
  });
}
window.showAddPat=()=>openMod(`
  <div class="mtit">➕ Novo paciente</div>
  <div style="display:flex;flex-direction:column;gap:11px">
    <div class="fl"><label>Nome completo</label><input id="pn" placeholder="João Silva"/></div>

window.doJoin=async()=>{

  const q=query(collection(db,'patients'),where('inviteCode','==',code));

  await updateDoc(doc(db,'patients',d.id),{members:arrayUnion(CU.uid),[`memberNames.${CU.uid}`]:CU.displayName||CU.email});

async function openPat(id){
  const sn=await getDoc(doc(db,'patients',id));
  if(!sn.exists()){toast('Paciente não encontrado.');return}
  CP={id,d:sn.data()};
  el('h-n').textContent='❤️ '+CP.d.name;
  el('h-s').textContent=`${CP.d.age} anos · ${CP.d.condition||''}`;
  show('s-app');
  UNS.forEach(u=>u());UNS=[];
  UNS.push(onSnapshot(doc(db,'patients',id),sn=>{if(sn.exists()){CP.d=sn.data();if(AT)rTab(AT)}}));
  gT('home');
}
window.goSel=()=>{UNS.forEach(u=>u());UNS=[];CP=null;el('sos-b').style.display='none';show('s-sel');loadPats()};

// ══ TABS ══
window.gT=tab=>{
  AT=tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  el('t-'+tab)?.classList.add('on');
  el('app-c').innerHTML='<div class="spin"></div>';
  setTimeout(()=>rTab(tab),40);
};
function rTab(tab){
  const c=el('app-c');c.innerHTML='';
  const w=document.createElement('div');w.className='fi';
  if(tab==='chat'){rChat(w);c.appendChild(w);return}
  switch(tab){
    case'home':  w.innerHTML=rHome();  break;
    case'meds':  w.innerHTML=rMeds();  break;
    case'agenda':w.innerHTML=rAgenda();break;
    case'quick': w.innerHTML=rQuick(); break;
    case'diary': w.innerHTML=rDiary(); break;
    case'wb':    w.innerHTML=rWB();    break;
    case'mem':   w.innerHTML=rMem();   break;
    case'music': w.innerHTML=rMusic(); break;
    case'rep':   w.innerHTML=rRep();   break;
    case'cfg':   w.innerHTML=rCfg();   break;
  }
  c.appendChild(w);
  if(tab==='home')fetchWeather();
}

window.takeMed=async(mid,t)=>{
  const td=today(),k=`medsTaken.${td}.${mid}-${t}`;
  const meds=CP.d.medications||[];
  const med=meds.find(m=>m.id===mid);if(!med)return;
  const nm=meds.map(m=>m.id===mid?{...m,stock:Math.max(0,m.stock-1)}:m);
  await updateDoc(doc(db,'patients',CP.id),{[k]:{by:CU.displayName||CU.email,at:nowT(),uid:CU.uid},medications:nm});
  await logEnt({details:`${med.name} ${med.dose} administrado.`,category:'💊 Medicação',severity:'LEVE'});

// ══ REPORT ══
function rRep(){
  const p=CP.d,logs=p.logs||[],meds=p.medications||[];
  const sc={LEVE:0,MODERADO:0,GRAVE:0,CRITICO:0};logs.forEach(l=>{if(sc[l.severity]!==undefined)sc[l.severity]++});
  const cc={};logs.forEach(l=>{cc[l.category]=(cc[l.category]||0)+1});
  const tc=Object.entries(cc).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const wb=p.wellbeing||[],pd=wb.filter(w=>w.pain!=null);
  const ap=pd.length?(pd.reduce((s,w)=>s+w.pain,0)/pd.length).toFixed(1):'—';
  return`<div style="font-family:var(--serif);font-size:18px;font-weight:600;margin-bottom:14px">📊 Relatório</div>
  <div class="card"><div class="ct">Resumo</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <div class="sb"><div class="sn">${logs.length}</div><div class="sl">registros</div></div>
      <div class="sb"><div class="sn">${meds.length}</div><div class="sl">remédios</div></div>
      <div class="sb"><div class="sn">${wb.length}</div><div class="sl">bem-estar</div></div>
      <div class="sb"><div class="sn" style="font-size:17px">${ap}</div><div class="sl">dor média</div></div>
    </div>
  </div>
  <div class="card"><div class="ct">Por severidade</div>
    ${Object.entries(sc).filter(([,v])=>v>0).map(([k,v])=>`<div style="display:flex;align-items:center;gap:9px;margin-bottom:9px">
      <span class="bdg ${SC[k]?.cl||'bl'}" style="min-width:88px;text-align:center">${SC[k]?.lb||k}</span>
      <div style="flex:1;background:var(--warm);border-radius:8px;height:9px;overflow:hidden">
        <div style="height:100%;background:${k==='LEVE'?'var(--green)':k==='MODERADO'?'var(--amber)':k==='GRAVE'?'var(--coral)':'var(--red)'};width:${Math.round(v/Math.max(logs.length,1)*100)}%;border-radius:8px"></div>
      </div>
      <span style="font-weight:700;min-width:18px">${v}</span>
    </div>`).join('')}
  </div>
  ${tc.length?`<div class="card"><div class="ct">Categorias mais registradas</div>${tc.map(([c,n])=>`<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px"><span>${esc(c)}</span><strong style="color:var(--teal)">${n}x</strong></div>`).join('')}</div>`:''}
  <div class="card"><div class="ct">Medicamentos</div>
    ${meds.map(m=>{const dl=Math.floor(m.stock/(m.daily||1));return`<div style="display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--border)">
      <div style="width:9px;height:9px;border-radius:50%;background:${m.color||'var(--teal)'};flex-shrink:0"></div>
      <div style="flex:1;font-size:13px">${esc(m.name)} ${esc(m.dose)}</div>
      <span style="font-size:12px;font-weight:700;color:${dl<7?'var(--red)':'var(--muted)'}">${dl}d</span>
    </div>`}).join('')}
  </div>
  <button onclick="expTxt()" style="width:100%;padding:12px;background:var(--purple);color:white;border:none;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--sans)">📄 Exportar relatório (.txt)</button>`;
}
window.expTxt=()=>{
  const p=CP.d;
  let t=`RELATÓRIO — ${p.name.toUpperCase()}\n${new Date().toLocaleString('pt-BR')}\nIdade: ${p.age} | Condição: ${p.condition||''} | Sangue: ${p.blood||''} | Alergias: ${p.allergy||'—'}\nCuidadores: ${Object.values(p.memberNames||{}).join(', ')}\n\nMEDICAMENTOS:\n`;
  (p.medications||[]).forEach(m=>{t+=`  • ${m.name} ${m.dose} — ${m.daily}x/dia — ${Math.floor(m.stock/(m.daily||1))} dias\n`});
  t+=`\nREGISTROS:\n`;
  [...(p.logs||[])].reverse().forEach(l=>{t+=`  [${l.date}] ${l.caregiver}: ${l.details} (${l.category} — ${l.severity})\n`});
  const b=new Blob([t],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`relatorio_${p.name.toLowerCase()}_${today()}.txt`;a.click();
  toast('✅ Relatório exportado!');
};

// ══ CONFIG ══
function rCfg(){
  const p=CP.d,mb=p.memberNames||{};
  return`<div style="font-family:var(--serif);font-size:18px;font-weight:600;margin-bottom:14px">⚙️ Configurações</div>
  <div class="card"><div class="ct">👥 Cuidadores de ${esc(p.name)}</div>
    ${Object.entries(mb).map(([uid,name])=>`<div class="mr">
      <div class="av">👤</div>
      <div style="flex:1"><div style="font-size:14px;font-weight:600">${esc(name)}</div>
        <div style="font-size:11px;color:var(--muted)">${uid===p.createdBy?'Responsável':uid===CU.uid?'Você':''}</div></div>
      ${uid!==p.createdBy&&uid!==CU.uid?`<button onclick="remMb('${uid}')" style="font-size:12px;color:var(--red);background:var(--red-l);border:none;border-radius:8px;padding:6px 10px;cursor:pointer">Remover</button>`:''}
    </div>`).join('')}
    <div style="margin-top:13px;background:var(--teal-l);border-radius:10px;padding:11px 13px">
      <div style="font-size:13px;color:var(--teal-d);margin-bottom:5px">🔗 Código de convite para novos cuidadores:</div>
      <div style="font-size:22px;font-weight:700;letter-spacing:4px;color:var(--teal);text-align:center;padding:7px">${p.inviteCode}</div>
      <button onclick="copyCode()" style="width:100%;padding:9px;background:var(--teal);color:white;border:none;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--sans)">📋 Copiar código</button>
    </div>
  </div>
  <div class="card"><div class="ct">👤 Perfil do paciente</div>
    ${[['Nome',p.name],['Idade',p.age+' anos'],['Condição',p.condition||'—'],['Tipo sanguíneo',p.blood||'—'],['Alergias',p.allergy||'Nenhuma']].map(([k,v])=>`
    <div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px"><span style="color:var(--muted)">${k}</span><strong>${esc(v)}</strong></div>`).join('')}
    <button onclick="showEditP()" style="width:100%;padding:10px;border:1.5px solid var(--teal);border-radius:10px;color:var(--teal);font-size:13px;font-weight:600;background:transparent;margin-top:11px;cursor:pointer">✏️ Editar perfil</button>
  </div>
  <div class="card"><div class="ct">🔔 Notificações</div>
    <button onclick="reqNotif()" style="width:100%;padding:11px;background:var(--purple);color:white;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--sans)">Ativar alertas de remédios</button>
    <div style="font-size:12px;color:var(--muted);margin-top:7px;line-height:1.5">Alerta no horário de cada remédio, mesmo com o app fechado.</div>
  </div>
  <div class="card"><div class="ct">👤 Sua conta</div>
    <div style="font-size:14px;margin-bottom:11px"><strong>${esc(CU.displayName||'')}</strong><br><span style="color:var(--muted);font-size:13px">${esc(CU.email)}</span></div>
    <button onclick="doLogout()" class="btn btn-r">Sair da conta</button>
  </div>`;
}
window.copyCode=()=>{const c=CP.d.inviteCode;navigator.clipboard?.writeText(c).then(()=>toast('✅ Código copiado: '+c)).catch(()=>toast('Código: '+c))};
window.remMb=async uid=>{
  if(!confirm('Remover este cuidador?'))return;
  const nm={...CP.d.memberNames};delete nm[uid];
  await updateDoc(doc(db,'patients',CP.id),{members:arrayRemove(uid),memberNames:nm});toast('Cuidador removido.');
};
window.showEditP=()=>{
  const p=CP.d;
  openMod(`<div class="mtit">✏️ Editar perfil</div>
  <div style="display:flex;flex-direction:column;gap:10px">
    <div class="fl"><label>Nome</label><input id="epn" value="${esc(p.name)}"/></div>
    <div class="fl"><label>Idade</label><input id="epa" type="number" value="${p.age}"/></div>
    <div class="fl"><label>Condição</label><input id="epc" value="${esc(p.condition||'')}"/></div>
    <div class="fl"><label>Tipo sanguíneo</label><input id="epb" value="${esc(p.blood||'')}"/></div>
    <div class="fl"><label>Alergias</label><input id="epal" value="${esc(p.allergy||'')}"/></div>
    <button class="btn btn-p" onclick="doEditP()">Salvar</button>
    <button class="btn btn-g" onclick="closeMod()">Cancelar</button>
  </div>`);
};
window.doEditP=async()=>{
  await updateDoc(doc(db,'patients',CP.id),{name:el('epn')?.value?.trim()||CP.d.name,age:parseInt(el('epa')?.value||CP.d.age),condition:el('epc')?.value?.trim()||'',blood:el('epb')?.value?.trim()||'',allergy:el('epal')?.value?.trim()||''});
  closeMod();toast('✅ Perfil atualizado!');
};

// ══ SOS ══
window.trigSOS=async()=>{
  const b=el('sos-b');b.style.display=b.style.display==='none'?'block':'none';
  if(b.style.display==='block'){await logEnt({details:'🚨 EMERGÊNCIA acionada pelo app.',category:'❤️ Sinais Vitais',severity:'CRITICO'});toast('🚨 SOS! Ligue 192 agora.',5000)}
};

// ══ NOTIFS ══
window.reqNotif=async()=>{
  if(!('Notification' in window)){toast('Notificações não suportadas.');return}
  const r=await Notification.requestPermission();
  if(r==='granted'){toast('✅ Notificações ativadas!');schedN()}else toast('Bloqueado nas configurações do celular.');
};
window.schedN=()=>{
  if(Notification.permission!=='granted'||!CP)return;
  let n=0;
  (CP.d.medications||[]).forEach(m=>{
    (m.times||[]).forEach(t=>{
      const[hh,mm]=t.split(':').map(Number),now=new Date(),tg=new Date();
      tg.setHours(hh,mm,0,0);if(tg<=now)tg.setDate(tg.getDate()+1);
      const dl=tg-now;
      if(dl<86400000){setTimeout(()=>{new Notification(`💊 Remédio de ${CP.d.name}`,{body:`${m.name} ${m.dose} — ${t}`,vibrate:[300,100,300],requireInteraction:true,tag:`med-${m.id}-${t}`})},dl);n++}
    });
  });
  if(n>0)toast(`🔔 ${n} alertas agendados!`);
};

// ══ PWA ══
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').then(()=>console.log('[SW] ok')).catch(e=>console.info('[SW]',e.message));
let DP=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();DP=e;if(!localStorage.getItem('pwa_ok'))setTimeout(()=>el('pwab').style.display='flex',4000)});
window.installPWA=async()=>{
  if(!DP){alert('iPhone (Safari):\n1. Toque em Compartilhar ⬆️\n2. "Adicionar à Tela de Início"\n3. Confirmar\n\nO ícone ❤️ aparecerá na tela!');el('pwab').style.display='none';return}
  DP.prompt();const r=await DP.userChoice;DP=null;el('pwab').style.display='none';
  if(r.outcome==='accepted')toast('❤️ App instalado!');
};
window.addEventListener('appinstalled',()=>toast('❤️ Instalado com sucesso!'));

// ══ NETWORK ══
const ob=el('obar');
const upN=()=>{if(!navigator.onLine){ob.style.display='block';document.body.style.marginTop='34px'}else{ob.style.display='none';document.body.style.marginTop=''}};
window.addEventListener('online',upN);window.addEventListener('offline',upN);upN();

// ══ INIT ══
window._app = { renderReg, renderLogin, doForgot };
renderLogin();
</script>
